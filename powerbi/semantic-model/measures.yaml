# =============================================================================
# ATLAS certified KPI catalogue  -  SINGLE SOURCE OF TRUTH for every measure
# -----------------------------------------------------------------------------
# scripts/generate_measure_artifacts.py turns this file into
#   * measures.tmdl          -> apply in Power BI Desktop TMDL view / Tabular Editor
#   * measures.dax           -> DAX query view (DEFINE MEASURE ... "Update model")
#   * docs/07_kpi_catalogue.md -> business glossary for the specialist departments
# Changing a definition = pull request + review by the KPI owner (see governance doc).
# =============================================================================
table: _Measures
measures:

# ------------------------------------------------------------------ 01 Volume
- name: Work Orders
  folder: 01 Volume
  format: "#,0"
  owner: Field Service
  description: Number of valid, non-cancelled work orders created in the selected period.
  expression: COUNTROWS ( 'Work Orders' )

- name: Failure Work Orders
  folder: 01 Volume
  format: "#,0"
  owner: Asset Management
  description: Reactive work orders (Corrective + Emergency). Denominator for MTBF, FTF and PM ratio.
  expression: CALCULATE ( [Work Orders], 'Work Orders'[Is Failure] = TRUE () )

- name: Preventive Work Orders
  folder: 01 Volume
  format: "#,0"
  owner: Asset Management
  description: Planned preventive maintenance work orders.
  expression: CALCULATE ( [Work Orders], 'Work Orders'[Work Order Type] = "Preventive" )

- name: Emergency Work Orders
  folder: 01 Volume
  format: "#,0"
  owner: Field Service
  description: Priority-1 emergency call-outs.
  expression: CALCULATE ( [Work Orders], 'Work Orders'[Work Order Type] = "Emergency" )

- name: Open Backlog
  folder: 01 Volume
  format: "#,0"
  owner: Field Service
  description: Work orders that are Open or In Progress (snapshot, ignores the date filter).
  expression: |-
    CALCULATE (
        [Work Orders],
        'Work Orders'[Status] IN { "Open", "In Progress" },
        REMOVEFILTERS ( 'Date' )
    )

# ------------------------------------------------------------------ 02 Cost
- name: Maintenance Cost
  folder: 02 Cost
  format: "#,0 €"
  owner: Controlling
  description: Labour cost + material cost of work orders created in the period (EUR).
  expression: SUM ( 'Work Orders'[Maintenance Cost] )

- name: Labor Cost
  folder: 02 Cost
  format: "#,0 €"
  owner: Controlling
  description: Labour hours x technician hourly rate (EUR).
  expression: SUM ( 'Work Orders'[Labor Cost] )

- name: Material Cost
  folder: 02 Cost
  format: "#,0 €"
  owner: Controlling
  description: Spare parts and consumables (EUR).
  expression: SUM ( 'Work Orders'[Material Cost] )

- name: Downtime Cost
  folder: 02 Cost
  format: "#,0 €"
  owner: Controlling
  description: Estimated production loss = downtime hours x EUR/hour rate by asset criticality (A 1,200 / B 450 / C 150), approved by Controlling.
  expression: SUM ( 'Work Orders'[Downtime Cost] )

- name: Total Cost of Ownership
  folder: 02 Cost
  format: "#,0 €"
  owner: Controlling
  description: Maintenance cost + downtime cost. The KPI that makes preventive maintenance comparable with reactive repair.
  expression: '[Maintenance Cost] + [Downtime Cost]'

- name: Cost per Asset
  folder: 02 Cost
  format: "#,0 €"
  owner: Controlling
  description: Maintenance cost divided by the number of current assets in scope.
  expression: DIVIDE ( [Maintenance Cost], [Asset Count] )

- name: TCO per Asset
  folder: 02 Cost
  format: "#,0 €"
  owner: Controlling
  description: Total cost of ownership divided by the number of current assets in scope.
  expression: DIVIDE ( [Total Cost of Ownership], [Asset Count] )

# ------------------------------------------------------------------ 03 Budget
- name: Budget
  folder: 03 Budget
  format: "#,0 €"
  owner: Controlling
  description: Approved monthly maintenance budget (EUR). Granularity is month x site.
  expression: SUM ( 'Budget'[Budget Amount] )

- name: Budget Variance
  folder: 03 Budget
  format: "+#,0 €;-#,0 €;0 €"
  owner: Controlling
  description: Maintenance cost minus budget. Positive = overrun.
  expression: IF ( NOT ISBLANK ( [Budget] ), [Maintenance Cost] - [Budget] )

- name: Budget Variance %
  folder: 03 Budget
  format: "+0.0%;-0.0%;0.0%"
  owner: Controlling
  description: Maintenance cost / budget - 1. Positive = overrun.
  expression: IF ( NOT ISBLANK ( [Budget] ), DIVIDE ( [Maintenance Cost], [Budget] ) - 1 )

- name: Maintenance Cost Forecast FY
  folder: 03 Budget
  format: "#,0 €"
  owner: Controlling
  description: Linear run-rate forecast for the full calendar year of the last loaded date (YTD actual / elapsed days x days in year).
  expression: |-
    VAR _lastDate = CALCULATE ( MAX ( 'Work Orders'[Created Date] ), REMOVEFILTERS ( 'Date' ) )
    VAR _yearStart = DATE ( YEAR ( _lastDate ), 1, 1 )
    VAR _yearEnd = DATE ( YEAR ( _lastDate ), 12, 31 )
    VAR _ytd = CALCULATE ( [Maintenance Cost], DATESBETWEEN ( 'Date'[Date], _yearStart, _lastDate ) )
    VAR _elapsedDays = INT ( _lastDate - _yearStart ) + 1
    VAR _daysInYear = INT ( _yearEnd - _yearStart ) + 1
    RETURN
        DIVIDE ( _ytd, _elapsedDays ) * _daysInYear

- name: Budget Status Color
  folder: 03 Budget
  format: ""
  owner: BI Platform
  description: Hex colour for conditional formatting (field value). Green on/under budget, amber up to +5 %, red above.
  expression: |-
    VAR _v = [Budget Variance %]
    RETURN
        SWITCH (
            TRUE (),
            ISBLANK ( _v ), "#8A8F98",
            _v > 0.05, "#C0392B",
            _v > 0, "#D68910",
            "#1E8449"
        )

# ------------------------------------------------------------------ 04 Reliability
- name: Asset Count
  folder: 04 Reliability
  format: "#,0"
  owner: Asset Management
  description: Number of distinct current assets in scope. Site/Region filters are transferred with TREATAS because Asset is not related to Site (avoids an ambiguous model).
  expression: |-
    CALCULATE (
        DISTINCTCOUNT ( 'Asset'[Asset ID] ),
        'Asset'[Is Current] = TRUE (),
        TREATAS ( VALUES ( 'Site'[Site ID] ), 'Asset'[Site ID] )
    )

- name: Hours in Period
  folder: 04 Reliability
  format: "#,0"
  owner: Asset Management
  description: Calendar hours in the selected period, capped at the last loaded date.
  expression: |-
    VAR _lastDataDate = CALCULATE ( MAX ( 'Work Orders'[Created Date] ), REMOVEFILTERS () )
    VAR _start = MIN ( 'Date'[Date] )
    VAR _end = MIN ( MAX ( 'Date'[Date] ), _lastDataDate )
    RETURN
        MAX ( ( INT ( _end - _start ) + 1 ) * 24, 0 )

- name: Downtime Hours
  folder: 04 Reliability
  format: "#,0.0"
  owner: Asset Management
  description: Asset downtime caused by the work orders (hours).
  expression: SUM ( 'Work Orders'[Downtime Hours] )

- name: Availability %
  folder: 04 Reliability
  format: "0.00%"
  owner: Asset Management
  description: (Asset count x hours in period - downtime) / (asset count x hours in period).
  expression: |-
    VAR _capacity = [Asset Count] * [Hours in Period]
    RETURN
        DIVIDE ( _capacity - [Downtime Hours], _capacity )

- name: MTBF (h)
  folder: 04 Reliability
  format: "#,0"
  owner: Asset Management
  description: Mean Time Between Failures = operating hours / number of failure work orders. Higher is better.
  expression: |-
    DIVIDE (
        [Asset Count] * [Hours in Period] - [Downtime Hours],
        [Failure Work Orders]
    )

- name: MTTR (h)
  folder: 04 Reliability
  format: "0.00"
  owner: Asset Management
  description: Mean Time To Repair = average hours from start to completion of completed failure work orders. Lower is better.
  expression: |-
    CALCULATE (
        AVERAGE ( 'Work Orders'[Repair Hours] ),
        'Work Orders'[Is Failure] = TRUE (),
        'Work Orders'[Status] = "Completed"
    )

- name: Asset Risk Score
  folder: 04 Reliability
  format: "0.0"
  owner: Asset Management
  description: Failures x criticality weight (A3/B2/C1) x age factor (1 + age/20) x downtime factor. Only evaluated for a single asset; used for the repair-or-replace list.
  expression: |-
    IF (
        HASONEVALUE ( 'Asset'[Asset ID] ),
        VAR _crit = CALCULATE ( SELECTEDVALUE ( 'Asset'[Criticality] ), 'Asset'[Is Current] = TRUE () )
        VAR _weight = SWITCH ( _crit, "A", 3, "B", 2, "C", 1, 1 )
        VAR _age = CALCULATE ( SELECTEDVALUE ( 'Asset'[Asset Age] ), 'Asset'[Is Current] = TRUE () )
        VAR _maxDowntime = MAXX ( ALLSELECTED ( 'Asset'[Asset ID] ), [Downtime Hours] )
        RETURN
            [Failure Work Orders] * _weight * ( 1 + DIVIDE ( _age, 20 ) )
                * ( 1 + DIVIDE ( [Downtime Hours], _maxDowntime ) )
    )

- name: Cost to Replacement Ratio
  folder: 04 Reliability
  format: "0.00"
  owner: Asset Management
  description: TCO in the period / replacement value of the asset. >= 1 means repairing costs more than replacing.
  expression: |-
    IF (
        HASONEVALUE ( 'Asset'[Asset ID] ),
        DIVIDE (
            [Total Cost of Ownership],
            CALCULATE ( MAX ( 'Asset'[Replacement Value] ), 'Asset'[Is Current] = TRUE () )
        )
    )

- name: Downtime Pareto Cumulative %
  folder: 04 Reliability
  format: "0.0%"
  owner: Asset Management
  description: Cumulative share of downtime by failure description, sorted descending (80/20 analysis).
  expression: |-
    VAR _current = [Downtime Hours]
    VAR _table =
        ADDCOLUMNS (
            ALLSELECTED ( 'Failure Code'[Failure Description] ),
            "@downtime", [Downtime Hours]
        )
    VAR _cumulative = SUMX ( FILTER ( _table, [@downtime] >= _current ), [@downtime] )
    VAR _total = SUMX ( _table, [@downtime] )
    RETURN
        IF ( NOT ISBLANK ( _current ), DIVIDE ( _cumulative, _total ) )

# ------------------------------------------------------------------ 05 Service
- name: SLA Compliance %
  folder: 05 Service
  format: "0.0%"
  owner: Field Service
  description: Share of started work orders whose response time (created -> started) met the priority target (P1 4h, P2 24h, P3 72h, P4 240h).
  expression: |-
    DIVIDE (
        CALCULATE ( [Work Orders], 'Work Orders'[Is SLA Met] = TRUE () ),
        CALCULATE ( [Work Orders], NOT ISBLANK ( 'Work Orders'[Started At] ) )
    )

- name: First Time Fix %
  folder: 05 Service
  format: "0.0%"
  owner: Field Service
  description: Share of failure work orders fixed at the first visit.
  expression: |-
    DIVIDE (
        CALCULATE ( [Failure Work Orders], 'Work Orders'[First Time Fix] = TRUE () ),
        [Failure Work Orders]
    )

- name: PM Ratio %
  folder: 05 Service
  format: "0.0%"
  owner: Asset Management
  description: Preventive / (Preventive + Failure) work orders. World-class benchmark >= 80 %.
  expression: DIVIDE ( [Preventive Work Orders], [Preventive Work Orders] + [Failure Work Orders] )

- name: Emergency Share %
  folder: 05 Service
  format: "0.0%"
  owner: Field Service
  description: Emergency work orders / failure work orders.
  expression: DIVIDE ( [Emergency Work Orders], [Failure Work Orders] )

- name: Avg Response (h)
  folder: 05 Service
  format: "0.0"
  owner: Field Service
  description: Average hours from work order creation to start of work.
  expression: AVERAGE ( 'Work Orders'[Response Hours] )

# ------------------------------------------------------------------ 06 Time Intelligence (explicit, for the most used KPI)
- name: Maintenance Cost YTD
  folder: 06 Time Intelligence
  format: "#,0 €"
  owner: Controlling
  description: Year-to-date maintenance cost.
  expression: TOTALYTD ( [Maintenance Cost], 'Date'[Date] )

- name: Maintenance Cost PY
  folder: 06 Time Intelligence
  format: "#,0 €"
  owner: Controlling
  description: Maintenance cost in the same period of the previous year.
  expression: CALCULATE ( [Maintenance Cost], SAMEPERIODLASTYEAR ( 'Date'[Date] ) )

- name: Maintenance Cost YoY %
  folder: 06 Time Intelligence
  format: "+0.0%;-0.0%;0.0%"
  owner: Controlling
  description: Change vs. same period previous year.
  expression: |-
    VAR _py = [Maintenance Cost PY]
    RETURN
        IF ( NOT ISBLANK ( _py ), DIVIDE ( [Maintenance Cost] - _py, _py ) )

- name: Maintenance Cost 3M Moving Avg
  folder: 06 Time Intelligence
  format: "#,0 €"
  owner: Controlling
  description: Average monthly maintenance cost over the current and two previous months (WINDOW function, requires Year Month on the axis).
  expression: |-
    AVERAGEX (
        WINDOW ( -2, REL, 0, REL, ALLSELECTED ( 'Date'[Year Month] ), ORDERBY ( 'Date'[Year Month], ASC ) ),
        [Maintenance Cost]
    )

# ------------------------------------------------------------------ 07 Storytelling
- name: Executive Narrative
  folder: 07 Storytelling
  format: ""
  owner: BI Platform
  description: Auto-generated one-paragraph summary for the executive page (replaces manual commentary).
  expression: |-
    VAR _cost = [Maintenance Cost]
    VAR _var = [Budget Variance %]
    VAR _sites =
        ADDCOLUMNS ( VALUES ( 'Site'[Site Name] ), "@var", [Budget Variance %] )
    VAR _worst = TOPN ( 1, _sites, [@var], DESC )
    VAR _worstName = MAXX ( _worst, 'Site'[Site Name] )
    VAR _worstVar = MAXX ( _worst, [@var] )
    VAR _scope = SELECTEDVALUE ( 'Site'[Region], "all regions" )
    RETURN
        "Maintenance cost for " & _scope & " is "
            & FORMAT ( DIVIDE ( _cost, 1e6 ), "0.00" ) & " M€, "
            & FORMAT ( ABS ( _var ), "0.0%" ) & IF ( _var > 0, " above", " below" ) & " budget. "
            & "Availability is " & FORMAT ( [Availability %], "0.00%" )
            & " with a PM ratio of " & FORMAT ( [PM Ratio %], "0%" ) & ". "
            & IF (
                _worstVar > 0.05,
                "Attention: " & _worstName & " is " & FORMAT ( _worstVar, "0%" ) & " over budget.",
                "No site is more than 5% over budget."
            )

- name: Dynamic Page Title
  folder: 07 Storytelling
  format: ""
  owner: BI Platform
  description: Page title that reflects the current slicer selection.
  expression: |-
    "Maintenance performance | "
        & SELECTEDVALUE ( 'Site'[Region], "All regions" ) & " | "
        & IF (
            HASONEVALUE ( 'Date'[Year] ),
            FORMAT ( VALUES ( 'Date'[Year] ), "0" ),
            FORMAT ( MIN ( 'Date'[Date] ), "MMM yyyy" ) & " - " & FORMAT ( MAX ( 'Date'[Date] ), "MMM yyyy" )
        )

- name: Data Freshness
  folder: 07 Storytelling
  format: ""
  owner: BI Platform
  description: Shows the newest loaded work order so users always know how current the data is.
  expression: '"Data as of " & FORMAT ( CALCULATE ( MAX ( ''Work Orders''[Created At] ), REMOVEFILTERS () ), "dd.MM.yyyy HH:mm" )'
